<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HS">
  <!-- Disco escuro preenchido, e nao transparente como o logo do header:
       a aba do navegador pode ser clara ou escura, e um "HS" claro sobre
       fundo transparente sumiria numa aba branca. O disco garante o
       contraste nos dois casos. -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0b"/>
  <!-- Anel mais grosso que o do header (1px la, 2.5 aqui): a 16px, que e o
       tamanho real da aba, um tra\u00e7o de 1px viraria menos de meio pixel. -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#ddd8d0" stroke-opacity="0.55" stroke-width="2.5"/>
  <text x="32" y="41.5" text-anchor="middle"
        font-family="'Space Grotesk', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" letter-spacing="0.5" fill="#ddd8d0">HS</text>
</svg>
